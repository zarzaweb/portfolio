<!DOCTYPE html>
<html lang="es">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Portfolio{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">

    {% block extra_css %}{% endblock %}

</head>


<body>

<nav class="navbar">
    <a href="{{ url_for('main.inicio') }}" class="logo">
        Santiago Castañón Moreschi
    </a>

    <div class="nav-links">
        <a href="{{ url_for('projects.proyectos') }}">{{ _("Proyectos") }}</a>
        <a href="{{ url_for('main.sobre_mi') }}">{{ _("Sobre mí") }}</a>
        <a href="{{ url_for('main.contacto') }}">{{ _("Contacto") }}</a>

        <div class="language-selector">
            <a href="{{ url_for('main.idioma', lang='es') }}">🇪🇸</a>
            <a href="{{ url_for('main.idioma', lang='en') }}">🇬🇧</a>
        </div>
    </div>

</nav>

    {% block content %}{% endblock %}

    {% block extra_js %}{% endblock %}

</body>
</html>
